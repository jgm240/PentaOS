<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Regular pentagon outline with 5 colored strokes -->
  <defs>
    <style>
      .pentagon-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .text-label { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e"/>

  <!-- Perfect regular pentagon with 5 colored strokes -->
  <!-- Top side - Red (#FF6B6B) -->
  <line x1="100" y1="30" x2="167" y2="78" class="pentagon-line" stroke="#FF6B6B" stroke-width="4"/>

  <!-- Top-right side - Cyan (#4ECDC4) -->
  <line x1="167" y1="78" x2="141" y2="157" class="pentagon-line" stroke="#4ECDC4" stroke-width="4"/>

  <!-- Bottom side - Green (#95E77D) -->
  <line x1="141" y1="157" x2="59" y2="157" class="pentagon-line" stroke="#95E77D" stroke-width="4"/>

  <!-- Bottom-left side - Purple (#A78BFA) -->
  <line x1="59" y1="157" x2="33" y2="78" class="pentagon-line" stroke="#A78BFA" stroke-width="4"/>

  <!-- Top-left side - Orange (#FFB84D) -->
  <line x1="33" y1="78" x2="100" y2="30" class="pentagon-line" stroke="#FFB84D" stroke-width="4"/>

  <!-- Center circle for PentaOS branding -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="white" stroke-width="2"/>
  <text x="100" y="104" class="text-label" font-size="9">PentaOS</text>
</svg>
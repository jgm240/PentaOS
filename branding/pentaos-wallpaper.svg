<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="pentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Subtle pattern grid -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Large decorative pentagon (top right, subtle) -->
  <g opacity="0.08" transform="translate(1500, 150)">
    <line x1="200" y1="0" x2="336" y2="122" stroke="#FF6B6B" stroke-width="6"/>
    <line x1="336" y1="122" x2="281" y2="298" stroke="#4ECDC4" stroke-width="6"/>
    <line x1="281" y1="298" x2="119" y2="298" stroke="#95E77D" stroke-width="6"/>
    <line x1="119" y1="298" x2="64" y2="122" stroke="#A78BFA" stroke-width="6"/>
    <line x1="64" y1="122" x2="200" y2="0" stroke="#FFB84D" stroke-width="6"/>
  </g>

  <!-- Decorative elements (bottom left) -->
  <circle cx="150" cy="950" r="120" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.15"/>
  <circle cx="150" cy="950" r="80" fill="none" stroke="#4ECDC4" stroke-width="2" opacity="0.15"/>
  <circle cx="150" cy="950" r="40" fill="none" stroke="#FFB84D" stroke-width="2" opacity="0.15"/>

  <!-- Central content area -->
  <!-- Main pentagon logo (center-left, larger) -->
  <g transform="translate(400, 540)" filter="url(#glow)">
    <!-- Pentagon outline with 5 colored strokes -->
    <circle cx="0" cy="0" r="200" fill="url(#pentaGlow)"/>

    <!-- Perfect regular pentagon -->
    <line x1="0" y1="-150" x2="142" y2="-47" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
    <line x1="142" y1="-47" x2="88" y2="121" stroke="#4ECDC4" stroke-width="8" stroke-linecap="round"/>
    <line x1="88" y1="121" x2="-88" y2="121" stroke="#95E77D" stroke-width="8" stroke-linecap="round"/>
    <line x1="-88" y1="121" x2="-142" y2="-47" stroke="#A78BFA" stroke-width="8" stroke-linecap="round"/>
    <line x1="-142" y1="-47" x2="0" y2="-150" stroke="#FFB84D" stroke-width="8" stroke-linecap="round"/>

    <!-- Center text -->
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">PentaOS</text>
  </g>

  <!-- Right side content area with colored accent bars -->
  <g transform="translate(1000, 200)">
    <!-- Title area -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">PentaOS</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="24" fill="#4ECDC4">Multi-core Excellence for Raspberry Pi</text>

    <!-- Colored accent bars -->
    <rect x="0" y="100" width="8" height="80" fill="#FF6B6B"/>
    <rect x="20" y="100" width="8" height="80" fill="#4ECDC4"/>
    <rect x="40" y="100" width="8" height="80" fill="#95E77D"/>
    <rect x="60" y="100" width="8" height="80" fill="#A78BFA"/>
    <rect x="80" y="100" width="8" height="80" fill="#FFB84D"/>
  </g>

  <!-- Feature highlights (bottom right) -->
  <g transform="translate(1000, 650)" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.85">
    <text x="0" y="0">🚀 Performance Optimized</text>
    <text x="0" y="35">🖥️ Flexible Desktops</text>
    <text x="0" y="70">🎮 Compatibility Layer</text>
    <text x="300" y="0">⚡ Smart Setup</text>
    <text x="300" y="35">♿ Accessibility Tools</text>
    <text x="300" y="70">📦 Lightweight & Efficient</text>
  </g>

  <!-- Subtle corner accent (top left) -->
  <path d="M 0 0 L 150 0 L 0 150 Z" fill="#FF6B6B" opacity="0.05"/>

  <!-- Subtle corner accent (bottom right) -->
  <path d="M 1920 1080 L 1770 1080 L 1920 930 Z" fill="#A78BFA" opacity="0.05"/>

  <!-- Version text (bottom right) -->
  <text x="1850" y="1050" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.5" text-anchor="end">v1.0.0</text>
</svg>